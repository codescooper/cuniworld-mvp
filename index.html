<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#1a7a47" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>CuniWorld — Gestion Élevage Lapins</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ===== TOPBAR ===== -->
  <header class="topbar">
    <div class="brand">
      <div class="logo">🐇</div>
      <span class="title">CuniWorld</span>
    </div>

    <!-- Hidden elements wired by wireStatic / wireExtra — visible counterparts in the Actions panel -->
    <button id="btnExport" style="display:none" data-testid="btn-export" aria-hidden="true" tabindex="-1"></button>
    <label style="display:none" aria-hidden="true">
      <input id="fileImport" type="file" accept="application/json" data-testid="file-import" tabindex="-1" />
    </label>
    <button id="btnReset" style="display:none" data-testid="btn-reset" aria-hidden="true" tabindex="-1"></button>
    <div style="display:none" aria-hidden="true">
      <input id="guideToggle" type="checkbox" data-testid="guide-toggle" tabindex="-1" />
    </div>

    <div class="topbar-right">
      <span id="syncBadge" class="sync-badge local" aria-live="polite">Local</span>
      <div id="userInfo" class="user-info hidden"></div>
      <button id="btnNewRabbit" class="btn-new" data-testid="btn-new-rabbit">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
        <span class="btn-new-label">Nouveau lapin</span>
      </button>
    </div>
  </header>

  <!-- ===== APP LAYOUT ===== -->
  <div class="app-layout">

    <!-- ─── SIDEBAR ─── -->
    <nav class="sidebar" aria-label="Navigation principale">
      <button class="nav-item active" data-panel="dashboard" data-testid="nav-dashboard">
        <span class="nav-icon">📊</span>
        <span class="nav-label">Tableau de bord</span>
        <span class="nav-badge" id="badge-dashboard"></span>
      </button>
      <button class="nav-item" data-panel="rabbits" data-testid="nav-rabbits">
        <span class="nav-icon">🐇</span>
        <span class="nav-label">Mes Lapins</span>
        <span class="nav-badge" id="badge-rabbits"></span>
      </button>
      <button class="nav-item" data-panel="lots" data-testid="nav-lots">
        <span class="nav-icon">📦</span>
        <span class="nav-label">Lots / Jeunes</span>
        <span class="nav-badge" id="badge-lots"></span>
      </button>
      <button class="nav-item" data-panel="genealogy" data-testid="nav-genealogy">
        <span class="nav-icon">🌳</span>
        <span class="nav-label">Généalogie</span>
        <span class="nav-badge" id="badge-genealogy"></span>
      </button>
      <button class="nav-item" data-panel="batiments" data-testid="nav-batiments">
        <span class="nav-icon">🏗️</span>
        <span class="nav-label">Bâtiments</span>
        <span class="nav-badge" id="badge-batiments"></span>
      </button>
      <button class="nav-item" data-panel="magasin" data-testid="nav-magasin">
        <span class="nav-icon">🏪</span>
        <span class="nav-label">Magasin</span>
        <span class="nav-badge" id="badge-magasin"></span>
      </button>
      <button class="nav-item" data-panel="stats" data-testid="nav-stats">
        <span class="nav-icon">📈</span>
        <span class="nav-label">Statistiques</span>
        <span class="nav-badge" id="badge-stats"></span>
      </button>
      <button class="nav-item" data-panel="actions" data-testid="nav-actions">
        <span class="nav-icon">⚙️</span>
        <span class="nav-label">Actions</span>
        <span class="nav-badge" id="badge-actions"></span>
      </button>
    </nav>

    <!-- ─── CONTENU PRINCIPAL ─── -->
    <main class="content-area">

      <!-- Panneau : Tableau de bord -->
      <div class="section-panel panel-active" id="panel-dashboard" data-panel="dashboard">
        <div class="panel-header">
          <div class="panel-title-group">
            <span class="panel-icon">📊</span>
            <span class="panel-title">Tableau de bord</span>
          </div>
        </div>
        <div class="panel-body">
          <div id="dash" class="dash" data-testid="dash"></div>
        </div>
      </div>

      <!-- Panneau : Lapins (split liste / détail) -->
      <div class="section-panel" id="panel-rabbits" data-panel="rabbits">
        <div class="panel-header">
          <div class="panel-title-group">
            <span class="panel-icon">🐇</span>
            <span class="panel-title">Mes Lapins</span>
          </div>
        </div>
        <div class="panel-body rl-body">

          <div class="rl-left">
            <div class="rl-search">
              <input id="q" class="input" placeholder="Rechercher…" data-testid="rabbit-search" />
              <div class="row" style="gap:var(--space-2)">
                <select id="sexFilter" class="input" data-testid="filter-sex" style="flex:1">
                  <option value="">Sexe: Tous</option>
                  <option value="F">Femelle</option>
                  <option value="M">Mâle</option>
                  <option value="U">Inconnu</option>
                </select>
                <select id="statusFilter" class="input" data-testid="filter-status" style="flex:1">
                  <option value="">Statut: Tous</option>
                  <option value="actif">Actif</option>
                  <option value="vendu">Vendu</option>
                  <option value="mort">Mort</option>
                </select>
              </div>
            </div>
            <div id="rabbitList" class="list" data-testid="rabbit-list"></div>
          </div>

          <div class="rl-right">
            <div id="rabbitDetails" class="muted" data-testid="rabbit-details">
              Sélectionne un lapin pour voir ses détails.
            </div>
            <div id="eventsPanel" data-testid="events-panel"></div>
          </div>

        </div>
      </div>

      <!-- Panneau : Lots -->
      <div class="section-panel" id="panel-lots" data-panel="lots">
        <div class="panel-header">
          <div class="panel-title-group">
            <span class="panel-icon">📦</span>
            <span class="panel-title">Lots / Jeunes</span>
          </div>
        </div>
        <div class="panel-body">
          <div class="row" style="gap:var(--space-2)">
            <input id="lotQ" class="input" placeholder="Rechercher (cage, mère, date…)" data-testid="lot-search" style="flex:2" />
            <select id="lotStatusFilter" class="input" data-testid="lot-status-filter" style="flex:1">
              <option value="">Statut: Tous</option>
              <option value="en_cours">En cours</option>
              <option value="vendu">Vendu</option>
              <option value="termine">Terminé</option>
            </select>
          </div>
          <div id="lotList" class="list" data-testid="lot-list"></div>
          <div id="lotDetails" class="muted" data-testid="lot-details">Sélectionnez un lot.</div>
        </div>
      </div>

      <!-- Panneau : Généalogie -->
      <div class="section-panel" id="panel-genealogy" data-panel="genealogy">
        <div class="panel-header">
          <div class="panel-title-group">
            <span class="panel-icon">🌳</span>
            <span class="panel-title">Généalogie 3D</span>
          </div>
        </div>
        <div class="panel-body gene-panel-body">
          <div class="gene-controls">
            <input id="geneQ" class="input" placeholder="Rechercher un lapin (code, nom, cage…)" data-testid="gene-search" style="flex:1" />
            <button id="geneResetView" class="btn secondary" data-testid="gene-reset-view">Réinitialiser la vue</button>
          </div>
          <div id="geneFocusBadge" class="gene-focus-badge" hidden></div>
          <div class="gene-viewport">
            <div id="geneGraph" class="gene-3d-stage" data-testid="gene-graph"></div>
            <div id="geneSideCard" class="gene-sidecard" hidden></div>
          </div>
          <div id="geneList" class="list" data-testid="gene-list" style="display:none"></div>
        </div>
      </div>

      <!-- Panneau : Bâtiments -->
      <div class="section-panel" id="panel-batiments" data-panel="batiments">
        <div class="panel-header">
          <div class="panel-title-group">
            <span class="panel-icon">🏗️</span>
            <span class="panel-title">Bâtiments &amp; Loges</span>
          </div>
          <div class="panel-header-actions">
            <button class="btn secondary" id="btnQuickSetup">⚡ Config. rapide</button>
            <button class="btn" id="btnAddBuilding">+ Bâtiment</button>
          </div>
        </div>
        <div class="panel-body">
          <div id="buildingsDash"></div>
        </div>
      </div>

      <!-- Panneau : Magasin -->
      <div class="section-panel" id="panel-magasin" data-panel="magasin">
        <div class="panel-header">
          <div class="panel-title-group">
            <span class="panel-icon">🏪</span>
            <span class="panel-title">Magasin</span>
          </div>
          <div class="panel-header-actions">
            <button class="btn" id="btnAddStock">+ Ajouter article</button>
          </div>
        </div>
        <div class="panel-body">
          <div id="stockDash"></div>
        </div>
      </div>

      <!-- Panneau : Statistiques -->
      <div class="section-panel" id="panel-stats" data-panel="stats">
        <div class="panel-header">
          <div class="panel-title-group">
            <span class="panel-icon">📈</span>
            <span class="panel-title">Statistiques globales</span>
          </div>
        </div>
        <div class="panel-body">
          <div id="statsDash"></div>
        </div>
      </div>

      <!-- Panneau : Actions -->
      <div class="section-panel" id="panel-actions" data-panel="actions">
        <div class="panel-header">
          <div class="panel-title-group">
            <span class="panel-icon">⚙️</span>
            <span class="panel-title">Actions & Paramètres</span>
          </div>
        </div>
        <div class="panel-body">
          <div class="more-actions">

            <button id="moreNewRabbit" class="more-action-tile" type="button">
              <span class="tile-icon">🐇</span>
              <span class="tile-body">
                <span class="tile-title">Nouveau lapin</span>
                <span class="tile-sub">Enregistrer un nouvel animal</span>
              </span>
            </button>

            <button id="moreExport" class="more-action-tile" type="button">
              <span class="tile-icon">⬇</span>
              <span class="tile-body">
                <span class="tile-title">Exporter les données</span>
                <span class="tile-sub">Sauvegarde JSON de votre élevage</span>
              </span>
            </button>

            <button id="moreExportRabbitsCSV" class="more-action-tile" type="button">
              <span class="tile-icon">🧾</span>
              <span class="tile-body">
                <span class="tile-title">Export lapins CSV</span>
                <span class="tile-sub">Tableau des lapins (Excel/Sheets)</span>
              </span>
            </button>

            <button id="moreExportEventsCSV" class="more-action-tile" type="button">
              <span class="tile-icon">🧾</span>
              <span class="tile-body">
                <span class="tile-title">Export événements CSV</span>
                <span class="tile-sub">Historique des événements (CSV)</span>
              </span>
            </button>

            <label class="more-action-tile file-tile" style="cursor:pointer">
              <span class="tile-icon">⬆</span>
              <span class="tile-body">
                <span class="tile-title">Importer des données</span>
                <span class="tile-sub">Restaurer depuis un fichier JSON</span>
              </span>
              <input id="moreFileImport" type="file" accept="application/json" />
            </label>

            <div class="more-guide-row">
              <label class="more-guide-label" for="moreGuideToggle">
                <span class="tile-icon">📖</span>
                <span class="tile-body">
                  <span class="guide-label-text">Mode Guide interactif</span>
                  <span class="guide-label-sub">Apprendre à utiliser l'application</span>
                </span>
              </label>
              <div>
                <input id="moreGuideToggle" type="checkbox" class="switch-dark-input" />
                <span class="switch-dark-slider"></span>
              </div>
            </div>

            <button id="morePhotoCheck" class="more-action-tile" type="button">
              <span class="tile-icon">📷</span>
              <span class="tile-body">
                <span class="tile-title">Prise de photo assistée</span>
                <span class="tile-sub">Photographier les lapins en attente</span>
              </span>
            </button>

            <button id="moreWeightCheck" class="more-action-tile" type="button">
              <span class="tile-icon">⚖️</span>
              <span class="tile-body">
                <span class="tile-title">Prise de poids assistée</span>
                <span class="tile-sub">Peser les lapins en attente de pesée</span>
              </span>
            </button>

            <button id="moreReset" class="more-action-tile danger-tile" type="button">
              <span class="tile-icon">⚠️</span>
              <span class="tile-body">
                <span class="tile-title">Réinitialiser les données</span>
                <span class="tile-sub">Supprime tous les lapins et événements</span>
              </span>
            </button>

            <button id="moreTournee" class="more-action-tile" type="button">
              <span class="tile-icon">📋</span>
              <span class="tile-body">
                <span class="tile-title">Tournée du jour</span>
                <span class="tile-sub" id="tourneeStatusLabel">Eau · Nourriture · Nettoyage</span>
              </span>
            </button>

            <button id="moreNotifications" class="more-action-tile" type="button">
              <span class="tile-icon">🔔</span>
              <span class="tile-body">
                <span class="tile-title">Notifications push</span>
                <span class="tile-sub" id="notifStatusLabel">Activer les alertes élevage</span>
              </span>
            </button>

            <button id="moreRetrySync" class="more-action-tile" type="button">
              <span class="tile-icon">🔄</span>
              <span class="tile-body">
                <span class="tile-title">Réessayer la synchronisation</span>
                <span class="tile-sub">Relancer les écritures cloud en attente</span>
              </span>
            </button>

          </div>

          <div class="section-card" style="margin-top:14px">
            <div style="font-weight:700;margin-bottom:8px">Sauvegardes locales</div>
            <div id="backupList" class="list"></div>
          </div>
        </div>
      </div>

    </main><!-- /content-area -->

  </div><!-- /app-layout -->

  <!-- ===== GUIDE OVERLAY ===== -->
  <div id="guideOverlay" class="guide-overlay hidden" data-testid="guide-overlay">
    <div class="guide-content">
      <div class="guide-header">
        <button id="guideClose" class="iconbtn">✕</button>
        <h2 id="guideTitle">Guide</h2>
      </div>
      <div class="guide-body">
        <div id="guideStepNumber" class="guide-step-number">Étape 1/14</div>
        <div id="guideDescription" class="guide-description"></div>
      </div>
      <div class="guide-footer">
        <button id="guidePrev" class="btn secondary">← Précédent</button>
        <div id="guideProgress" class="guide-progress"></div>
        <button id="guideNext" class="btn">Suivant →</button>
      </div>
    </div>
  </div>

  <!-- ===== MODAL ===== -->
  <div id="modal" class="modal hidden" aria-hidden="true" data-testid="modal">
    <div class="modal-backdrop" data-close="1"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <h3 id="modalTitle">Modal</h3>
        <button class="iconbtn" id="modalClose" title="Fermer">✕</button>
      </div>
      <div id="modalBody" class="modal-body" data-testid="modal-body"></div>
    </div>
  </div>

  <!-- ===== AUTH OVERLAY ===== -->
  <div id="authOverlay" class="auth-overlay hidden" aria-modal="true" role="dialog">
    <!-- Contenu injecté dynamiquement par wireAuth.js -->
  </div>

  <div id="toastRoot" class="toast-root" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
