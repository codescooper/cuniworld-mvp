limit_req_zone $binary_remote_addr zone=cuni_auth:10m rate=5r/s;
server {
 listen 8080;
 server_name _;
 resolver 127.0.0.11 valid=10s ipv6=off;
 root /usr/share/nginx/html;
 server_tokens off;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header X-Frame-Options SAMEORIGIN always;
 location = / { try_files /index.html =404; add_header X-Robots-Tag 'noindex, follow' always; add_header Cache-Control 'no-store' always; }
 location = /index.html { add_header X-Robots-Tag 'noindex, follow' always; add_header Cache-Control 'no-store' always; }
 location = /sw.js { add_header Cache-Control 'no-store' always; }

 location ^~ /backend/auth/v1/admin { return 404; }
 location ^~ /backend/auth/v1/ {
  limit_req zone=cuni_auth burst=20 nodelay;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  set $auth_backend cuniworld-auth:9999;
  rewrite ^/backend/auth/v1/(.*)$ /$1 break;
  proxy_pass http://$auth_backend;
  add_header X-Robots-Tag 'noindex, nofollow' always;
 }
 location ^~ /backend/rest/v1/ {
  proxy_set_header Host $host;
  set $rest_backend cuniworld-rest:3000;
  rewrite ^/backend/rest/v1/(.*)$ /$1 break;
  proxy_pass http://$rest_backend;
  add_header X-Robots-Tag 'noindex, nofollow' always;
 }
 location ^~ /backend/storage/v1/ {
  client_max_body_size 50m;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  set $storage_backend cuniworld-storage:5000;
  rewrite ^/backend/storage/v1/(.*)$ /$1 break;
  proxy_pass http://$storage_backend;
  add_header X-Robots-Tag 'noindex, nofollow' always;
 }
 location ^~ /backend/realtime/v1/ {
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection 'upgrade';
  proxy_set_header Host realtime-dev.cuniworld-realtime;
  proxy_read_timeout 3600s;
  set $realtime_backend realtime-dev.cuniworld-realtime:4000;
  rewrite ^/backend/realtime/v1/(.*)$ /socket/$1 break;
  proxy_pass http://$realtime_backend;
  add_header X-Robots-Tag 'noindex, nofollow' always;
 }
 location /backend/ { return 404; }

 location /api/ { add_header X-Robots-Tag 'noindex, nofollow' always; return 404; }
 location /assets/ { try_files $uri =404; expires 1y; }
 location ~ /\. { deny all; }
 location / { try_files $uri $uri/ =404; }
}
