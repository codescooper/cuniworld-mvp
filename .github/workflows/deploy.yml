name: Validate CuniWorld

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Playwright locked in this project supports Ubuntu 24.04, not ubuntu-latest 26.04.
    runs-on: ubuntu-24.04
    env:
      GITHUB_PAGES: "false"
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run checks
        run: npm run check

      - name: Build
        run: npm run build

      - name: Upload validated build
        uses: actions/upload-artifact@v4
        with:
          name: cuniworld-validated-build
          path: ./dist
